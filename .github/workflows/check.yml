name: check

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: The empty pack passes the pack check
        run: |
          cp -r pack-template "$RUNNER_TEMP/me"
          python3 scripts/check_pack.py --me "$RUNNER_TEMP/me"
      - name: The English check runs
        run: echo "I build small teams. They ship often." | python3 scripts/english_check.py
      - name: The kit is consistent (file references, the two copies of the rules, skill names)
        run: python3 scripts/check_kit.py
      - name: The tracker the kit describes and a YAML reader (for the tool-list and profile-reader tests)
        run: python3 -m pip install --quiet "tracker-mcp>=0.8.3,<0.9" pyyaml
      - name: Regression tests on made-up packs
        env:
          KIT_NEEDS_TRACKER: "1"
        run: python3 -m unittest discover -s tests -v
      - name: Manifests are valid JSON
        run: |
          python3 -m json.tool .claude-plugin/plugin.json > /dev/null
          python3 -m json.tool .claude-plugin/marketplace.json > /dev/null
      - name: No candidate pack in the repository
        run: test ! -e me
      - name: Every skill and command has a description
        run: |
          for f in skills/*/SKILL.md commands/*.md; do
            grep -q '^description:' "$f" || { echo "no description: $f"; exit 1; }
          done
      - name: The plugin validates
        run: |
          npm install -g @anthropic-ai/claude-code > /dev/null 2>&1
          claude plugin validate .
      - name: The plugin version has a CHANGELOG entry
        run: |
          v="$(python3 -c 'import json;print(json.load(open(".claude-plugin/plugin.json"))["version"])')"
          grep -q "^## $v " CHANGELOG.md || { echo "CHANGELOG.md has no '## $v' entry"; exit 1; }
      - name: Hooks are valid JSON and the hook script runs
        run: |
          python3 -m json.tool hooks/hooks.json > /dev/null
          sh hooks/session-start.sh
